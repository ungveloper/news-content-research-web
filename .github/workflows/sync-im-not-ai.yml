name: Sync im-not-ai rules

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      allow_major_change:
        description: "검토 후 im-not-ai major 버전 변경을 허용"
        required: false
        default: false
        type: boolean
      allow_large_change:
        description: "검토 후 quick-rules 대규모 크기 변경을 허용"
        required: false
        default: false
        type: boolean
      test_alert:
        description: "실패 알림 경로 테스트 (실제 GitHub Issue 생성)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  issues: write

concurrency:
  group: sync-im-not-ai-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: npm

      - name: Simulate failure for alert-path test
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert }}
        run: |
          echo "의도된 실패: im-not-ai sync 실패 알림 경로를 검증합니다."
          exit 1

      - name: Sync latest im-not-ai rules safely
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IM_NOT_AI_ALLOW_MAJOR_CHANGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.allow_major_change == 'true' && '1' || '0' }}
          IM_NOT_AI_ALLOW_LARGE_CHANGE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.allow_large_change == 'true' && '1' || '0' }}
        run: node scripts/sync-im-not-ai.mjs

      - name: Detect rule changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- lib/im-not-ai.generated.ts third_party/im-not-ai/LICENSE third_party/im-not-ai/sync-state.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci --audit=false

      - name: Validate production dependency security
        if: steps.changes.outputs.changed == 'true'
        run: |
          npm run audit:production
          npm run audit:security

      - name: Validate project and im-not-ai integration contract
        if: steps.changes.outputs.changed == 'true'
        run: npm run validate

      - name: Commit and push synchronized rules
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/im-not-ai.generated.ts third_party/im-not-ai/LICENSE third_party/im-not-ai/sync-state.json
          git commit -m "변경: im-not-ai 최신 규칙 동기화"
          git push origin HEAD:main

      - name: Create or update sync failure issue
        if: ${{ failure() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ALERT_TITLE: "im-not-ai 자동 동기화 실패 — 검토 필요"
          TEST_ALERT: ${{ github.event_name == 'workflow_dispatch' && inputs.test_alert && 'yes' || 'no' }}
        shell: bash
        run: |
          set -euo pipefail
          RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          ISSUE_NUMBER="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq '.[] | select(.title == "im-not-ai 자동 동기화 실패 — 검토 필요") | .number' | head -n 1)"

          BODY="$(mktemp)"
          cat > "$BODY" <<EOF
          im-not-ai 자동 동기화가 실패했습니다.

          - 실행: $RUN_URL
          - 이벤트: $GITHUB_EVENT_NAME
          - ref: $GITHUB_REF
          - commit: $GITHUB_SHA
          - run attempt: $GITHUB_RUN_ATTEMPT
          - alert-path test: $TEST_ALERT

          major 버전 변경, quick-rules 대규모 변경, upstream 구조 변경, 검증 실패 또는 일시적인 GitHub/npm 오류일 수 있습니다.
          실행 로그를 확인한 뒤 필요한 경우 workflow_dispatch의 수동 승인 옵션을 사용하세요.
          EOF

          if [[ -n "$ISSUE_NUMBER" ]]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file "$BODY"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$ALERT_TITLE" --body-file "$BODY"
          fi

      - name: Close resolved sync failure issue
        if: ${{ success() }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          ISSUE_NUMBER="$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --limit 100 --json number,title --jq '.[] | select(.title == "im-not-ai 자동 동기화 실패 — 검토 필요") | .number' | head -n 1)"
          if [[ -n "$ISSUE_NUMBER" ]]; then
            RUN_URL="https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "다음 동기화가 정상 완료되어 자동으로 닫습니다: $RUN_URL"
            gh issue close "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --reason completed
          fi
