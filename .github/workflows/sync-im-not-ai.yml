name: Sync im-not-ai rules

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-im-not-ai-main
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Sync latest im-not-ai rules
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/sync-im-not-ai.mjs

      - name: Detect rule changes
        id: changes
        shell: bash
        run: |
          if git diff --quiet -- lib/im-not-ai.generated.ts third_party/im-not-ai/LICENSE; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.changes.outputs.changed == 'true'
        run: npm ci

      - name: Validate project
        if: steps.changes.outputs.changed == 'true'
        run: npm run validate

      - name: Commit and push synchronized rules
        if: steps.changes.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/im-not-ai.generated.ts third_party/im-not-ai/LICENSE
          git commit -m "변경: im-not-ai 최신 규칙 동기화"
          git push origin HEAD:main
